<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="guess_game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>guess_game</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      overscroll-behavior-x: none !important;
      overscroll-behavior-y: none !important;
      overscroll-behavior: none !important;
      touch-action: pan-y pinch-zoom !important;
    }
  </style>
  <script>
    // Prevent iOS and mobile browser edge swipe gesture back/forward
    window.addEventListener('touchstart', function (e) {
      if (e.touches && (e.touches[0].clientX < 35 || e.touches[0].clientX > window.innerWidth - 35)) {
        // Only prevent when swiping from the edge
        if (window.location.href.includes('/game/')) {
          e.preventDefault();
        }
      }
    }, { passive: false });

    // Trap browser popstate back navigation when in active game
    window.addEventListener('popstate', function (event) {
      if (window.location.href.includes('/game/')) {
        window.history.pushState(null, document.title, window.location.href);
      }
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
